name: Preview Cleanup

# Snapshots are created per pushed branch (preview.yml), so they are removed when
# the branch is deleted.
on:
  delete:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.event.ref_type == 'branch' && github.event.ref != 'main'
    permissions:
      contents: write
    steps:
      - name: Derive branch name
        id: branch
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          # Match the tag naming used by the preview workflow.
          TAG="snapshot-$(echo "$BRANCH" | tr '/' '-')"

          # Encode reserved characters before using the tag in a GitHub API path.
          ENCODED_TAG="$(jq -rn --arg tag "$TAG" '$tag | @uri')"

          # Publish values for the cleanup step.
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "encoded_tag=$ENCODED_TAG" >> "$GITHUB_OUTPUT"

      - name: Delete preview release and tag
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi

          # gh fills in {owner}/{repo} from GH_REPO.
          TAG_REF_PATH="repos/{owner}/{repo}/git/refs/tags/$ENCODED_TAG"

          # The tag may already be gone (another run or replication lag); treat that as success.
          if output="$(gh api --method DELETE "$TAG_REF_PATH" 2>&1)"; then
            echo "Tag $TAG deleted"
            exit 0
          fi

          if grep -q "Reference does not exist" <<< "$output"; then
            echo "Tag $TAG already deleted"
            exit 0
          fi

          echo "$output" >&2
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.branch.outputs.tag }}
          ENCODED_TAG: ${{ steps.branch.outputs.encoded_tag }}
