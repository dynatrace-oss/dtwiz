name: Main Snapshot

on:
  push:
    branches:
      - main

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check for semver tag
        id: semver
        run: |
          if git describe --tags --match "v*" --abbrev=0 > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No semver tag reachable — skipping snapshot." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove non-semver tags locally
        if: steps.semver.outputs.found == 'true'
        # xargs -r is a GNU extension; this workflow runs on ubuntu-latest so it is available.
        run: git tag -l | (grep -v '^v' || true) | xargs -r git tag -d

      - name: Delete existing snapshot-main release (if any)
        if: steps.semver.outputs.found == 'true'
        run: |
          gh release delete snapshot-main --yes || true
          git push origin :refs/tags/snapshot-main || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser snapshot
        if: steps.semver.outputs.found == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture snapshot version
        if: steps.semver.outputs.found == 'true'
        id: version
        run: |
          VERSION=""
          for f in dist/dtwiz_*_linux_amd64.tar.gz; do
            tmp="${f#dist/dtwiz_}"
            VERSION="${tmp%_linux_amd64.tar.gz}"
            break
          done
          if [ -z "$VERSION" ]; then
            echo "Error: could not determine snapshot version — no matching artifact found." >&2
            ls -la dist/ 2>/dev/null || echo "  dist/ does not exist" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "$VERSION" > dist/version.txt

      - name: Publish snapshot-main pre-release
        if: steps.semver.outputs.found == 'true'
        run: |
          gh release create snapshot-main \
            --prerelease \
            --title "Snapshot: main" \
            --notes "Latest snapshot from the \`main\` branch (commit \`${{ github.sha }}\`). Rebuilt on every push to \`main\`. Not for production use." \
            dist/dtwiz_*_linux_*.tar.gz \
            dist/dtwiz_*_darwin_*.tar.gz \
            dist/dtwiz_*_windows_*.zip \
            dist/version.txt \
            dist/checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
