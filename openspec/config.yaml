schema: spec-driven

context: |
  Tech stack: Go, Cobra CLI framework, Go templates (text/template)
  Build: `make build` (go build with ldflags), `make test`, `make lint` (golangci-lint), `make markdownlint` (Markdown, also run in CI)
  After writing or editing any artifact of a change, run `make markdownlint` and fix its findings (`make markdownlint-fix` autofixes most) before reporting the artifact as done.
  Release: goreleaser, archives per OS/arch
  Domain: Dynatrace observability CLI — analyzes systems and deploys the best monitoring method automatically

  Project structure:
    - main.go → cmd.Execute()
    - cmd/ — Cobra commands (root, analyze, recommend, setup, install, update, uninstall, status, version, auth)
      - root.go exposes setupClient() — the single entry point for creating an API client
    - pkg/client/ — dual HTTP client (ClassicClient + PlatformClient); New() takes resolved URLs + tokens
    - pkg/version/ — Version var injected via ldflags at build time
    - pkg/analyzer/ — system detection (platform, Docker, K8s, OneAgent, OTel, AWS, Azure, services)
    - pkg/recommender/ — priority-ranked ingestion recommendations
    - pkg/installer/ — per-method installers + shared utilities + embedded Go templates
    - scripts/ — curl|sh installer scripts

  CLI conventions:
    - Verb-noun command tree: top-level verbs (install, update, uninstall), methods as subcommands
    - All leaf commands set Args: cobra.NoArgs; parent commands use cobra.MinimumNArgs(1)
    - --dry-run as PersistentFlags().BoolVar() on parent, shared by subcommands
    - Zero-config defaults: OneAgent full-stack, K8s cloudNativeFullStack, AWS all services + all regions

  UX rules:
    - Before executing, show compact preview of commands/actions, print generated config inline
    - Single confirmation prompt: "Apply? [Y/n]" (default yes)
    - Reduce to the max: every output line must earn its place

  Auth:
    - Two URL families: Classic (no .apps.) with Api-Token, Platform (with .apps.) with Bearer
    - Token prefixes: dt0c01.* = API token, dt0s16.* = Platform token
    - Credentials from flags → env vars (DT_ENVIRONMENT, DT_ACCESS_TOKEN, DT_PLATFORM_TOKEN)
    - cmd handlers obtain the client via setupClient() in root.go — never construct pkg/client.Client directly in cmd

rules:
  proposal:
    - Include rollback plan for risky or architecture-level changes
    - Reference relevant feature flag names when new behavior is gated
    - Why describes the user-visible problem concretely, including today's wrong behavior and its root cause when known
    - What Changes states defaults, exit codes, error behavior and flag interactions, and ends with either "No breaking changes." or an inline **BREAKING** bullet giving old versus new behavior, plus a "Not in scope" line when scope could be misread
    - Impact uses labelled bullets as they apply (**Code** with file paths, **Feature flags** with name, CLI flag and env var, **Self-monitoring**, **Dependencies**, **Docs**, **Rollback**, **Follow-ups**) and names any in-flight change that touches the same code
    - Split large features into steps, with an umbrella capability for the overall plan and cross-step rules, and one change per step
  design:
    - Context references proposal.md for motivation instead of restating it, then lists only the current-state facts that shape the approach, naming real files and functions
    - State external facts (upstream releases, CLI output, APIs) against a named version and date; if they are not verified yet, add a preparation task that verifies them and records the result in design.md
    - Number every decision and title it with the choice made, as in "### D3. Availability becomes data", never a topic such as "Error handling"; other artifacts and later changes cite decisions as "design D3"
    - Each decision states what is decided, why, and at least one alternative with the reason it was rejected ("*Alternative:* ... (rejected because ...)")
    - Show contracts, not implementations, using layering diagrams, type and function signatures, the file new code goes into, and the exact user-facing strings (error texts, headings, JSON field names); no function bodies
    - When an in-flight change touches the same code, add a coordination decision naming that change, the shared files, who resolves the conflict, and which behavior stays true once both land
    - Every non-goal gives its reason and where the work goes instead (follow-up change, later step, never)
    - Risks use "[Risk] → Mitigation", with a named test as the mitigation where possible; accepted risks say "Accepted." and why
    - Open Questions holds only unknowns that can wait without changing specs, approach or tasks; write "None blocking." when there are none
  specs:
    - Use GIVEN/WHEN/THEN format for every scenario (GIVEN establishes state, WHEN describes the action, THEN states the observable outcome)
    - Describe WHAT the system does, not HOW — no method names, API endpoints, internal types, or implementation details
    - Reference existing patterns before introducing new ones
    - Document feature flag dependencies directly in scenarios
    - Title each requirement with the behavior it guarantees, as in "Guidance outcome exits as a configuration failure"
    - Make scenarios concrete, with named fixtures (paths, file names, accounts), the exact command run, and exact user-facing output and error strings
    - Include negative assertions where they matter ("nothing is deleted", "no preview is printed") and an "unchanged" scenario for neighbouring behavior that must not move
    - Every REMOVED requirement has a Reason and a Migration, and the Migration names the requirement that replaces it, if any
  tasks:
    - Reference concrete file paths from the key paths above
    - Always include relevant test layers
    - Define test cases derived from the spec to ensure coverage of new behavior and edge cases
    - Start with a short preamble covering package layout, scope (including what is explicitly left to a later change) and test conventions (docs/contributing/testing.md)
    - Order task groups by dependency, and put refactors with no visible behavior change in their own group, separate from behavior changes
    - Each task names its file, cites the design decision and spec scenario it implements ("design D2", "spec - <capability> \"<Scenario>\""), and ends with "verify in <file>_test.go" followed by the enumerated test cases
    - End with an integration group covering make test, make lint, make markdownlint, GOOS=windows go vet when platform code changes, openspec validate <change> --strict, and a manual run with exact commands that records any gaps
    - Close with a "Workflow follow-up" section when later changes or an archive order depend on this one
